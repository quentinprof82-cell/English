<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102A43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Improve My English">
  <meta name="description" content="Application mobile pour apprendre l'anglais : vocabulaire, expressions et progression.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Improve My English</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-flag">🇬🇧</div>
        <div class="brand-title">Improve<br>My English</div>
        <div class="brand-subtitle">Learn today<br>Speak tomorrow</div>
      </div>
      <nav class="side-nav" aria-label="Navigation principale">
        <button class="nav-item active" data-view="home"><span>⌂</span>Accueil</button>
        <button class="nav-item" data-view="learn"><span>▣</span>Apprendre</button>
        <button class="nav-item" data-view="progress"><span>▥</span>Ma progression</button>
        <button class="nav-item" data-view="review"><span>↻</span>Révisions</button>
        <button class="nav-item" data-view="stats"><span>🏆</span>Statistiques</button>
        <button class="nav-item" data-view="settings"><span>⚙</span>Paramètres</button>
      </nav>
      <div class="sidebar-quote">“A better you<br>speaks a brighter<br>future.”</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Hello ! 👋</h1>
          <p id="pageSubtitle">Prêt(e) à progresser aujourd’hui ?</p>
        </div>
        <div class="top-actions">
          <div class="streak" aria-label="Série en cours"><span>🔥</span><strong id="streak">7</strong><small>jours de suite</small></div>
          <div class="avatar" aria-label="Profil">Q</div>
        </div>
      </header>

      <section id="view-home" class="view active"></section>
      <section id="view-learn" class="view"></section>
      <section id="view-progress" class="view"></section>
      <section id="view-review" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>

    <nav class="mobile-nav" aria-label="Navigation mobile">
      <button class="nav-item active" data-view="home"><span>⌂</span><small>Accueil</small></button>
      <button class="nav-item" data-view="learn"><span>▣</span><small>Apprendre</small></button>
      <button class="nav-item" data-view="progress"><span>▥</span><small>Progression</small></button>
      <button class="nav-item" data-view="review"><span>↻</span><small>Révisions</small></button>
      <button class="nav-item" data-view="stats"><span>🏆</span><small>Stats</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
